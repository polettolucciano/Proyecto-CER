name: CER backups
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cer-backups
  cancel-in-progress: false
jobs:
  generate:
    if: vars.CER_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cer-backups
    env:
      CER_BACKUP_DATABASE_URL: ${{ secrets.CER_BACKUP_DATABASE_URL }}
      CER_BACKUP_AGE_RECIPIENT: ${{ vars.CER_BACKUP_AGE_RECIPIENT }}
      CER_BACKUP_REMOTE: ${{ vars.CER_BACKUP_REMOTE }}
      CER_SOURCE_PROJECT_REF: ${{ vars.CER_SOURCE_PROJECT_REF }}
      RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y age rclone
      - name: Configurar destino privado
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG_CREATE }}
        run: node -e 'require("fs").writeFileSync(process.env.RCLONE_CONFIG,process.env.RCLONE_CONFIG_TEXT,{mode:0o600})'
      - run: node scripts/backups/backup.mjs generate
      - name: Avisar fallo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CER_ALERT_WEBHOOK: ${{ secrets.CER_ALERT_WEBHOOK }}
        run: node scripts/backups/notify.mjs
  rotate:
    needs: generate
    if: vars.CER_BACKUP_ROTATION_ENABLED == 'true' && vars.CER_RESTORE_TESTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cer-backup-rotation
    env:
      CER_BACKUP_REMOTE: ${{ vars.CER_BACKUP_REMOTE }}
      RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y rclone
      - env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG_ROTATE }}
        run: node -e 'require("fs").writeFileSync(process.env.RCLONE_CONFIG,process.env.RCLONE_CONFIG_TEXT,{mode:0o600})'
      - run: node scripts/backups/backup.mjs rotate
      - if: vars.CER_STORAGE_BACKUP_ENABLED == 'true'
        run: node scripts/backups/storage.mjs rotate
