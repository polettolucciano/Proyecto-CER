name: CER backups
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cer-backups
  cancel-in-progress: false
jobs:
  generate:
    if: vars.CER_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cer-backups
    env:
      CER_BACKUP_AGE_RECIPIENT: ${{ vars.CER_BACKUP_AGE_RECIPIENT }}
      CER_SOURCE_PROJECT_REF: ${{ vars.CER_SOURCE_PROJECT_REF }}
    steps:
      - name: Definir ruta privada de configuración
        run: echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y age rclone
      - name: Configurar Google Drive privado
        env:
          RCLONE_CONFIG_DRIVE: ${{ secrets.RCLONE_CONFIG_DRIVE }}
        run: node scripts/backups/configure-drive.mjs
      - name: Preparar carpetas privadas de Drive
        run: |
          rclone mkdir "$CER_BACKUP_REMOTE/Diarios"
          rclone mkdir "$CER_BACKUP_REMOTE/Mensuales"
      - name: Comprobar acceso al destino Drive
        run: rclone lsf "$CER_BACKUP_REMOTE" --max-depth 1 > /dev/null
      - run: node scripts/backups/backup.mjs generate
        env:
          CER_BACKUP_DATABASE_URL: ${{ secrets.CER_BACKUP_DATABASE_URL }}
      - name: Limpiar credenciales temporales
        if: always()
        run: rm -f -- "$RCLONE_CONFIG"
      - name: Avisar fallo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CER_ALERT_WEBHOOK: ${{ secrets.CER_ALERT_WEBHOOK }}
        run: node scripts/backups/notify.mjs
  rotate:
    needs: generate
    if: vars.CER_BACKUP_ROTATION_ENABLED == 'true' && vars.CER_RESTORE_TESTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cer-backup-rotation
    env:
      CER_SOURCE_PROJECT_REF: ${{ vars.CER_SOURCE_PROJECT_REF }}
    steps:
      - name: Definir ruta privada de configuración
        run: echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Configurar Google Drive privado
        env:
          RCLONE_CONFIG_DRIVE: ${{ secrets.RCLONE_CONFIG_DRIVE }}
        run: node scripts/backups/configure-drive.mjs
      - name: Comprobar acceso al destino Drive
        run: rclone lsf "$CER_BACKUP_REMOTE" --max-depth 1 > /dev/null
      - run: node scripts/backups/backup.mjs rotate
      - if: vars.CER_STORAGE_BACKUP_ENABLED == 'true'
        run: node scripts/backups/storage.mjs rotate
      - name: Avisar fallo de rotación
        if: failure()
        env:
          CER_ALERT_WEBHOOK: ${{ secrets.CER_ALERT_WEBHOOK }}
        run: node scripts/backups/notify.mjs
      - name: Limpiar credenciales temporales
        if: always()
        run: rm -f -- "$RCLONE_CONFIG"
